[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lorayaki"
version = "0.1.0"
description = "Bake character LoRAs the day they drop — tagging (OppaiOracle + WD14), dataset prep, and LoCon training via kohya sd-scripts. Illustrious (SDXL) now, Anima later."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tsukimiya" }]
dependencies = [
    "pyyaml>=6.0",
    "tomli_w>=1.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "huggingface_hub>=0.23",
    "requests>=2.31",
]

[project.optional-dependencies]
# onnxruntime is only needed to RUN the OppaiOracle tagger locally.
# Kept optional: it may not have wheels for bleeding-edge Pythons, and the
# GPU machine may prefer onnxruntime-gpu. Install with: pip install -e ".[onnx]"
onnx = ["onnxruntime>=1.18"]
onnx-gpu = ["onnxruntime-gpu>=1.18"]
dev = ["pytest>=8.0", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
lorayaki = "lorayaki.cli:main"

[tool.setuptools.packages.find]
include = ["lorayaki*"]

[tool.setuptools.package-data]
lorayaki = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
